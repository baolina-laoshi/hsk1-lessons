<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Модальные глаголы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/*
VOICE: спокойная тетрадь ученика, учительская красная ручка, без суеты
IDEA: китайская прописная тетрадь 田字格 с пометками преподавателя
PICTURE: строка клеток 田字格 с модальными глаголами — карта темы, по клику открывает правило
COLOUR and TYPE: бумага, чёрная тушь, красный #c8102e; Noto Serif SC для иероглифов, Golos Text для русского
LAYOUT: заголовок и клетки сверху, под ними вкладки блоков, задания одной колонкой
*/
:root{color-scheme:light dark;--bg:light-dark(#fbfaf6,#14161b);--card:light-dark(#fff,#1c1f26);--ink:light-dark(#16181d,#ecebe6);--mute:light-dark(#6b6a66,#9c9b96);--red:light-dark(#c8102e,#ff6b6b);--redbg:light-dark(#fdecee,#3a1d21);--ok:light-dark(#1d6b3a,#6fd39a);--okbg:light-dark(#e6f4ea,#173226);--line:light-dark(#e6c9cc,#4a3135);--rule:light-dark(#e3e1da,#2d3038)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Golos Text",system-ui,sans-serif;overflow-x:clip}
.zh,.cell b{font-family:"Noto Serif SC","Songti SC",serif}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px);max-width:1000px;margin:0 auto}
h1{font-size:clamp(32px,6vw,48px);line-height:1.05;margin:0 0 8px;text-wrap:balance}
h2{font-size:24px;line-height:1.15;margin:0 0 6px}
.lead{color:var(--mute);margin:0 0 22px;max-width:62ch}
.grid{display:flex;flex-wrap:wrap;gap:14px}
.verb{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit}
.cells{display:flex}
.cell{width:clamp(58px,11vw,84px);aspect-ratio:1;border:2px solid var(--red);position:relative;display:grid;place-items:center;background:var(--card)}
.cell+.cell{border-left:0}
.cell::before,.cell::after{content:"";position:absolute;border:0 dashed var(--line)}
.cell::before{left:50%;top:0;bottom:0;border-left-width:1px}
.cell::after{top:50%;left:0;right:0;border-top-width:1px}
.cell b{position:relative;z-index:1;font-size:clamp(34px,6.4vw,50px);font-weight:700;line-height:1}
.verb small{font-size:13px;color:var(--mute);text-align:center;max-width:12em;line-height:1.3}
.verb:hover .cell,.verb:focus-visible .cell{background:var(--redbg)}
.verb:focus-visible{outline:2px solid var(--red);outline-offset:4px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
nav .in{max-width:1000px;margin:0 auto;padding:8px max(5vw,16px);display:flex;gap:8px;overflow-x:auto;align-items:center}
nav button{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font:500 15px "Golos Text",sans-serif;cursor:pointer}
nav button[aria-current=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav .score{margin-left:auto;flex:none;font-weight:600;color:var(--red);padding-left:12px;white-space:nowrap}
.task{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin:0 0 14px}
.ctx{color:var(--mute);font-size:15px;margin:0 0 4px}
.q{font-size:24px;margin:0 0 12px;line-height:1.5}
.q .gap{display:inline-block;min-width:2.4em;border-bottom:2px solid var(--red);text-align:center;color:var(--red)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;min-width:64px;padding:6px 14px;border-radius:8px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:500 16px "Golos Text",sans-serif;cursor:pointer;text-align:left}
.opt.zh{font-size:20px;font-weight:500}
.opt:focus-visible,.tile:focus-visible,.btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--redbg);border-color:var(--red);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.why{margin:12px 0 0;padding:10px 12px;border-left:3px solid var(--red);background:var(--redbg);font-size:15px;display:none}
.why.ok{border-color:var(--ok);background:var(--okbg)}
.why.show{display:block}
.why b{display:block;margin-bottom:2px}
.tray,.built{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.built{border-bottom:2px dashed var(--line);padding-bottom:8px;margin-bottom:10px}
.tile{min-height:44px;padding:4px 12px;border-radius:6px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:500 22px "Noto Serif SC",serif;cursor:pointer}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:600 15px "Golos Text",sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.theory{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px}
.theory .task h3{margin:0 0 6px;font-size:28px;font-family:"Noto Serif SC",serif;color:var(--red)}
.theory ul{margin:0;padding-left:18px}.theory li{margin:3px 0}
.ex{font-family:"Noto Serif SC",serif;font-size:18px}
.flash{animation:fl 1.2s}@keyframes fl{from{box-shadow:0 0 0 4px var(--red)}to{box-shadow:0 0 0 0 transparent}}
@media(prefers-reduced-motion:reduce){.flash{animation:none}}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--rule);padding:8px;text-align:left;vertical-align:top}
th{font-weight:600}
.blockhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.blockhead p{margin:0;color:var(--mute);flex-basis:100%}
.end{color:var(--mute);font-size:14px;padding-bottom:40px}
@media(max-width:600px){.q{font-size:21px}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--rule)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;color:var(--mute)}}
</style>
</head>

</header>

{id:'theory',name:'Правила',type:'theory'}
];

const S={};let cur='mean';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const isZh=s=>/[一-鿿]/.test(s);
const gap=q=>esc(q).replace('___','<span class="gap">？</span>');

document.getElementById('verbs').innerHTML=V.map(([z,l,t])=>`<button class="verb" data-go="${t}"><span class="cells">${[...z].map(ch=>`<span class="cell"><b>${ch}</b></span>`).join('')}</span><small>${esc(l)}</small></button>`).join('');

function init(id){const b=B.find(x=>x.id===id);if(!b.items)return;S[id]={order:shuf(b.items.map((_,i)=>i)),done:{},right:0}}
B.forEach(b=>init(b.id));

function score(){let r=0,n=0;B.forEach(b=>{if(b.type==='mc'||b.type==='order'){n+=b.items.length;r+=S[b.id].right}});document.getElementById('sc').textContent=`${r} / ${n}`}

function tabs(){document.getElementById('tabs').innerHTML=B.map(b=>`<button data-tab="${b.id}" aria-current="${b.id===cur}">${esc(b.name)}</button>`).join('')+'<span class="score" id="sc"></span>';score()}

function cmpTable(){return `<details class="task"><summary style="cursor:pointer;font-weight:600">Таблица: 会 и 可能</summary><table class="stack" style="margin-top:10px"><thead><tr><th></th><th>会</th><th>可能</th></tr></thead><tbody>${CMP.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`}

function render(){
 const b=B.find(x=>x.id===cur),m=document.getElementById('main');
 if(b.type==='theory'){m.innerHTML=`<div class="blockhead"><h2>Правила</h2><p>Конспект по теме. 会 и 可能 сравниваются в таблице внизу.</p></div><div class="theory">${T.map(([id,h,li,ex])=>`<div class="task" id="${id}"><h3>${esc(h)}</h3><ul>${li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="ex">${ex.map(esc).join('<br>')}</p></div>`).join('')}</div>${cmpTable().replace('<details class="task">','<details class="task" open>')}`;return}
 const st=S[cur];let h=`<div class="blockhead"><h2>${esc(b.name)}</h2><button class="btn ghost" data-reset="${cur}">Заново</button><p>${esc(b.intro)}</p></div>`;
 if(b.cmp)h+=cmpTable();
 h+=st.order.map(i=>{const it=b.items[i],d=st.done[i];
  if(b.type==='say')return `<div class="task"><p class="q" style="font-size:18px">${esc(it[0])}</p><button class="btn ghost" data-say="${i}">Показать вариант</button><p class="why ok ${d?'show':''}"><span class="zh" style="font-size:22px">${esc(it[1])}</span></p></div>`;
  if(b.type==='order'){const built=d?d.built:(st['b'+i]||[]);const pool=shuf(it.t.map((_,k)=>k));const left=(st['p'+i]||=pool).filter(k=>!built.includes(k));
   return `<div class="task" data-i="${i}"><div class="built">${built.map(k=>`<button class="tile" data-un="${k}" ${d?'disabled':''}>${esc(it.t[k])}</button>`).join('')}</div><div class="tray">${left.map(k=>`<button class="tile" data-put="${k}" ${d?'disabled':''}>${esc(it.t[k])}</button>`).join('')}</div>${d?'':`<div class="row"><button class="btn" data-check="${i}">Проверить</button></div>`}<p class="why ${d?(d.ok?'ok ':'')+'show':''}">${d?`<b>${d.ok?'Верно':'Правильно так: '+esc(it.a[0])+'。'}</b>${esc(it.w)}`:''}</p></div>`}
  const opts=(st['o'+i]||=shuf(it.o.filter(o=>o!=='Ошибки нет')).concat(it.o.includes('Ошибки нет')?['Ошибки нет']:[]));
  return `<div class="task" data-i="${i}">${it.c?`<p class="ctx">${esc(it.c)}</p>`:''}<p class="q zh">${gap(it.q)}</p><div class="opts">${opts.map(o=>{let c='';if(d){if(it.a.includes(o))c='right';else if(o===d.pick)c='wrong'}return `<button class="opt${isZh(o)?' zh':''} ${c}" data-pick="${esc(o)}" ${d?'disabled':''}>${esc(o)}</button>`}).join('')}</div><p class="why ${d?(d.ok?'ok ':'')+'show':''}">${d?`<b>${d.ok?'Верно':'Не совсем'}</b>${esc(it.w)}`:''}</p></div>`
 }).join('');
 m.innerHTML=h;
}

document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.tab){cur=t.dataset.tab;tabs();render();try{localStorage.setItem('modal-tab',cur)}catch(_){}document.getElementById('main').scrollIntoView({block:'start'});return}
 if(t.dataset.go){cur='theory';tabs();render();const el=document.getElementById(t.dataset.go);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash')}return}
 if(t.dataset.reset){init(t.dataset.reset);score();render();return}
 const st=S[cur],b=B.find(x=>x.id===cur),box=t.closest('[data-i]'),i=box?+box.dataset.i:+t.dataset.say;
 if(t.dataset.say!==undefined){st.done[i]=!st.done[i];render();return}
 if(t.dataset.pick!==undefined&&!st.done[i]){const it=b.items[i],ok=it.a.includes(t.dataset.pick);st.done[i]={pick:t.dataset.pick,ok};if(ok)st.right++;score();render();return}
 if(t.dataset.put!==undefined){(st['b'+i]||=[]).push(+t.dataset.put);render();return}
 if(t.dataset.un!==undefined){st['b'+i]=(st['b'+i]||[]).filter(k=>k!==+t.dataset.un);render();return}
 if(t.dataset.check!==undefined){const it=b.items[i],built=st['b'+i]||[];if(built.length<it.t.length)return;const s=built.map(k=>it.t[k]).join('');const ok=it.a.includes(s);st.done[i]={built,ok};if(ok)st.right++;score();render()}
});

try{const s=localStorage.getItem('modal-tab');if(s&&B.some(b=>b.id===s))cur=s}catch(_){}
tabs();render();
}
</script>
